<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM - Prospectos de Seguros</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="mb-8 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Gestión de Prospectos</h1>
        <p class="text-sm text-gray-500">Agencia de Seguros - Control y Seguimiento</p>
      </div>
      <button onclick="purgarCompletados()" class="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-4 py-2 rounded-lg text-sm font-medium transition">
        🧹 Limpiar Completados
      </button>
    </header>

    <!-- Formulario de Registro -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">Registrar Nuevo Posible Cliente</h2>
      <form id="formProspecto" onsubmit="guardarProspecto(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre Completo *</label>
          <input type="text" id="nombre" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono / WhatsApp *</label>
          <input type="tel" id="telefono" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
          <input type="email" id="email" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ramo de Seguro *</label>
          <select id="ramo" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Gastos Médicos Mayores">Gastos Médicos Mayores</option>
            <option value="Autos">Autos</option>
            <option value="Daños">Daños</option>
            <option value="Gastos medicos">Gastos medicos</option>
            <option value="Vida">Vida</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha y Hora de Contacto *</label>
          <input type="datetime-local" id="fecha_seguimiento" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Notas / Deducible / Detalles</label>
          <input type="text" id="notas" placeholder="Ej: Busca cobertura con AXA o GNP" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="md:col-span-3 flex justify-end mt-2">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm shadow transition">
            + Guardar y Programar Alerta
          </button>
        </div>
      </form>
    </section>

    <!-- Tabla y Filtros -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <div class="flex items-center space-x-2">
          <span class="text-sm font-medium text-gray-600">Filtrar por:</span>
          <select id="filtroEstado" onchange="cargarProspectos()" class="border rounded-md px-3 py-1 text-sm bg-white outline-none">
            <option value="Todos">Todos los registros</option>
            <option value="Pendiente">Pendientes</option>
            <option value="Completado">Completados</option>
          </select>
        </div>
        <button onclick="cargarProspectos()" class="text-sm text-blue-600 hover:underline">Refrescar</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
              <th class="py-3 px-4">Prospecto</th>
              <th class="py-3 px-4">Contacto</th>
              <th class="py-3 px-4">Ramo</th>
              <th class="py-3 px-4">Fecha Seguimiento</th>
              <th class="py-3 px-4">Estado</th>
              <th class="py-3 px-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo" class="divide-y divide-gray-200">
            <!-- Rellenado dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    async function cargarProspectos() {
      const filtro = document.getElementById('filtroEstado').value;
      const res = await fetch(`/api/prospectos/?estado=${filtro}`);
      const datos = await res.json();
      const cuerpo = document.getElementById('tablaCuerpo');
      cuerpo.innerHTML = '';

      if (datos.length === 0) {
        cuerpo.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">No hay prospectos registrados.</td></tr>`;
        return;
      }

      datos.forEach(p => {
        const fecha = new Date(p.fecha_seguimiento).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
        const esCompletado = p.estado === 'Completado';

        cuerpo.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-3 px-4 font-medium text-gray-900">${p.nombre}</td>
            <td class="py-3 px-4 text-gray-600">
              <div>📞 ${p.telefono}</div>
              ${p.email ? `<div class="text-xs text-gray-400">${p.email}</div>` : ''}
            </td>
            <td class="py-3 px-4"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs">${p.ramo}</span></td>
            <td class="py-3 px-4 font-mono text-xs text-gray-700">${fecha}</td>
            <td class="py-3 px-4">
              <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${esCompletado ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                ${p.estado}
              </span>
            </td>
            <td class="py-3 px-4 text-center space-x-2">
              ${!esCompletado ? `<button onclick="marcarHecho(${p.id})" title="Marcar como hecho" class="text-green-600 hover:text-green-800 text-base">✔</button>` : ''}
              <button onclick="eliminarProspecto(${p.id})" title="Eliminar registro" class="text-red-500 hover:text-red-700 text-base">🗑</button>
            </td>
          </tr>
        `;
      });
    }

    async function guardarProspecto(e) {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        email: document.getElementById('email').value || null,
        ramo: document.getElementById('ramo').value,
        fecha_seguimiento: new Date(document.getElementById('fecha_seguimiento').value).toISOString(),
        notas: document.getElementById('notas').value || null
      };

      const res = await fetch('/api/prospectos/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('formProspecto').reset();
        cargarProspectos();
      } else {
        alert('Error al guardar el prospecto.');
      }
    }

    async function marcarHecho(id) {
      await fetch(`/api/prospectos/${id}/completar`, { method: 'PATCH' });
      cargarProspectos();
    }

    async function eliminarProspecto(id) {
      if (confirm('¿Deseas eliminar este registro de forma permanente?')) {
        await fetch(`/api/prospectos/${id}`, { method: 'DELETE' });
        cargarProspectos();
      }
    }

    async function purgarCompletados() {
      if (confirm('¿Seguro que deseas eliminar todos los prospectos completados?')) {
        const res = await fetch('/api/prospectos/limpiar/completados', { method: 'DELETE' });
        const data = await res.json();
        alert(`Se eliminaron ${data.eliminados} registros.`);
        cargarProspectos();
      }
    }

    // Carga inicial
    cargarProspectos();
  </script>
</body>
</html>
